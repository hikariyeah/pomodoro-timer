<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" id="themeColor" content="#3a2230" />
<title>番茄钟 · Pomodoro</title>
<style>
  :root {
    --focus-1: #ff6b5e;
    --focus-2: #ff8e72;
    --short-1: #38c6a4;
    --short-2: #4fd1c5;
    --long-1: #5b8def;
    --long-2: #6aa6ff;
    --bg: #1a1625;
    --card: rgba(255,255,255,0.06);
    --text: #f4f1f9;
    --muted: rgba(244,241,249,0.55);
    --ring-bg: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  /* root color fills the mobile pull-down / overscroll area; equals the gradient's
     top edge color (see ::before, center at 50% 0%) so there is no seam.
     JS keeps this in sync with the current mode. */
  html {
    background-color: #3a2230;
    overscroll-behavior-y: none;
    transition: background-color 0.6s ease;
  }
  /* one continuous, full-screen fixed gradient — painted behind the status bar,
     the content and the overscroll area alike, so nothing splits at the notch */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(1300px 1000px at 50% 0%, #2a2440 0%, var(--bg) 60%);
    transition: background 0.6s ease;
  }
  body.mode-focus::before { background: radial-gradient(1300px 1000px at 50% 0%, #3a2230 0%, var(--bg) 60%); }
  body.mode-short::before { background: radial-gradient(1300px 1000px at 50% 0%, #163029 0%, var(--bg) 60%); }
  body.mode-long::before  { background: radial-gradient(1300px 1000px at 50% 0%, #1a2440 0%, var(--bg) 60%); }
  body {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: transparent;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 32px 28px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    text-align: center;
  }

  .modes {
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.22);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 30px;
  }
  .mode-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 6px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .mode-btn.active {
    background: rgba(255,255,255,0.14);
    color: var(--text);
  }

  .dial { position: relative; width: 280px; height: 280px; margin: 0 auto 28px; }
  .dial svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .dial .track { fill: none; stroke: var(--ring-bg); stroke-width: 14; }
  .dial .progress {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear, stroke 0.5s ease;
  }
  .dial-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .phase-label {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .controls { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: transform 0.12s ease, filter 0.2s ease, opacity 0.2s ease;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    flex: 1;
    max-width: 200px;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 16px;
    border-radius: 16px;
    color: #1a1625;
    background: linear-gradient(135deg, var(--focus-1), var(--focus-2));
    box-shadow: 0 10px 30px rgba(255,107,94,0.35);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-icon {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.16); }

  .footer {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
  }
  .count { display: flex; align-items: center; gap: 7px; }
  .tomato { font-size: 16px; }
  .settings-toggle {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    padding: 4px 8px; border-radius: 8px;
  }
  .settings-toggle:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  .settings {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.35s ease;
  }
  .settings.open { max-height: 520px; opacity: 1; margin-top: 18px; }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    text-align: left; padding: 2px 2px 8px;
  }
  .section-title + .setting-row { border-top: none; }
  .section-title:not(:first-child) {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .settings-inner {
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
    padding: 16px;
    text-align: left;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .setting-row + .setting-row { border-top: 1px solid rgba(255,255,255,0.06); }
  .setting-row label { font-size: 14px; color: var(--text); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 30px; height: 30px; border-radius: 9px; border: none;
    background: rgba(255,255,255,0.1); color: var(--text);
    font-size: 18px; cursor: pointer; line-height: 1; font-family: inherit;
  }
  .stepper button:hover { background: rgba(255,255,255,0.2); }
  .stepper span { width: 36px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }

  .footer-actions { display: flex; gap: 4px; }

  #history.open { max-height: 340px; }
  .history-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .history-stats { font-size: 13px; color: var(--muted); font-weight: 600; }
  .clear-btn {
    background: rgba(255,107,94,0.14); border: none; color: #ff8e72;
    font-size: 12px; font-weight: 600; font-family: inherit;
    padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .clear-btn:hover { background: rgba(255,107,94,0.24); }
  .history-list {
    max-height: 250px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
    padding-right: 2px;
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .hist-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px; padding: 9px 11px;
    font-size: 13px;
  }
  .hist-item .ico { font-size: 16px; width: 20px; text-align: center; }
  .hist-item .label { flex: 1; text-align: left; font-weight: 600; }
  .hist-item .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .hist-item.interrupted .label { color: var(--muted); text-decoration: line-through; }
  .hist-day {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    padding: 6px 2px 2px; text-align: left;
  }
  .hist-empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  .history-tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .tool-btn {
    flex: 1; background: rgba(255,255,255,0.08); border: none; color: var(--text);
    font-size: 12px; font-weight: 600; font-family: inherit;
    padding: 8px 4px; border-radius: 9px; cursor: pointer;
    transition: background 0.2s ease;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.16); }
  .tool-btn.connected { background: rgba(56,198,164,0.18); color: #4fd1c5; }
  .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .sync-status {
    font-size: 11.5px; color: var(--muted); text-align: left;
    min-height: 0; margin-bottom: 6px; transition: color 0.2s ease;
  }
  .sync-status.ok { color: #4fd1c5; }
  .sync-status.warn { color: #ff8e72; }
  .sync-status:empty { display: none; }

  @media (max-width: 420px) {
    .dial { width: 230px; height: 230px; }
    .time { font-size: 52px; }
  }
</style>
</head>
<body class="mode-focus">
  <div class="app">
    <div class="modes">
      <button class="mode-btn active" data-mode="focus">专注</button>
      <button class="mode-btn" data-mode="short">短休息</button>
      <button class="mode-btn" data-mode="long">长休息</button>
    </div>

    <div class="dial">
      <svg viewBox="0 0 280 280">
        <circle class="track" cx="140" cy="140" r="124"></circle>
        <circle class="progress" id="ring" cx="140" cy="140" r="124"></circle>
      </svg>
      <div class="dial-center">
        <div class="time" id="time">25:00</div>
        <div class="phase-label" id="phaseLabel">专注时间</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-icon" id="resetBtn" title="重置">↺</button>
      <button class="btn btn-primary" id="startBtn">开始</button>
      <button class="btn btn-icon" id="skipBtn" title="跳过">⏭</button>
    </div>

    <div class="footer">
      <div class="count"><span class="tomato">🍅</span><span id="cycleCount">今日 0 个</span></div>
      <div class="footer-actions">
        <button class="settings-toggle" id="historyToggle">历史 📊</button>
        <button class="settings-toggle" id="settingsToggle">设置 ⚙</button>
      </div>
    </div>

    <div class="settings" id="history">
      <div class="settings-inner">
        <div class="history-head">
          <div class="history-stats" id="historyStats">— 专注 0 分钟</div>
          <button class="clear-btn" id="clearHistory">清空</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <div class="settings" id="settings">
      <div class="settings-inner">
        <div class="section-title">⏱ 时长设置</div>
        <div class="setting-row">
          <label>专注 (分钟)</label>
          <div class="stepper" data-key="focus">
            <button data-step="-1">−</button><span>25</span><button data-step="1">+</button>
          </div>
        </div>
        <div class="setting-row">
          <label>短休息 (分钟)</label>
          <div class="stepper" data-key="short">
            <button data-step="-1">−</button><span>5</span><button data-step="1">+</button>
          </div>
        </div>
        <div class="setting-row">
          <label>长休息 (分钟)</label>
          <div class="stepper" data-key="long">
            <button data-step="-1">−</button><span>15</span><button data-step="1">+</button>
          </div>
        </div>
        <div class="setting-row">
          <label>几轮后长休息</label>
          <div class="stepper" data-key="interval">
            <button data-step="-1">−</button><span>4</span><button data-step="1">+</button>
          </div>
        </div>

        <div class="section-title">💾 数据恢复</div>
        <div class="history-tools">
          <button class="tool-btn" id="exportBtn">⬇ 导出</button>
          <button class="tool-btn" id="importBtn">⬆ 导入</button>
          <button class="tool-btn" id="syncBtn">🔗 连接文件</button>
        </div>
        <div class="sync-status" id="syncStatus"></div>
        <input type="file" id="importInput" accept="application/json,.json" hidden />
      </div>
    </div>
  </div>

<script>
(function () {
  const C = 2 * Math.PI * 124; // ring circumference

  const palettes = {
    focus: ['#ff6b5e', '#ff8e72'],
    short: ['#38c6a4', '#4fd1c5'],
    long:  ['#5b8def', '#6aa6ff'],
  };
  const labels = { focus: '专注时间', short: '短休息', long: '长休息' };
  // top color of each mode's gradient — used for the root/overscroll bg + browser chrome
  const topColors = { focus: '#3a2230', short: '#163029', long: '#1a2440' };

  const STORE_KEY = 'pomodoro.v1';

  const state = {
    durations: { focus: 25, short: 5, long: 15 },
    interval: 4,
    mode: 'focus',
    remaining: 25 * 60,
    running: false,
    cycle: 0,            // focus sessions since last long break
    tick: null,
    endAt: null,
    startedAt: null,     // wall-clock when current mode segment started running
    history: [],         // [{mode, status, seconds, ts}]
    fileHandle: null,    // connected FileSystemFileHandle (auto-sync)
    pendingHandle: null, // stored handle awaiting permission re-grant
  };

  // the single object that gets persisted everywhere (localStorage + file + export)
  function buildPayload() {
    return {
      version: 1,
      history: state.history,
      durations: state.durations,
      interval: state.interval,
      cycle: state.cycle,
    };
  }

  function applyPayload(data) {
    if (!data || typeof data !== 'object') return;
    if (Array.isArray(data.history)) state.history = data.history;
    if (data.durations) Object.assign(state.durations, data.durations);
    if (typeof data.interval === 'number') state.interval = data.interval;
    if (typeof data.cycle === 'number') state.cycle = data.cycle;
    state.remaining = state.durations[state.mode] * 60;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) applyPayload(JSON.parse(raw));
    } catch (e) { /* ignore corrupt storage */ }
  }

  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(buildPayload())); }
    catch (e) { /* storage full / unavailable */ }
  }

  // persist everywhere: localStorage always, plus the connected file if any
  function save() {
    saveLocal();
    if (state.fileHandle) writeFile();
  }

  // ---- IndexedDB: persists the file handle across sessions ----
  function idb(mode, fn) {
    return new Promise((resolve) => {
      let open;
      try { open = indexedDB.open('pomodoro', 1); }
      catch (e) { return resolve(undefined); }
      open.onupgradeneeded = () => open.result.createObjectStore('kv');
      open.onsuccess = () => {
        const db = open.result;
        const tx = db.transaction('kv', mode);
        const store = tx.objectStore('kv');
        const req = fn(store);
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => resolve(undefined);
      };
      open.onerror = () => resolve(undefined);
    });
  }
  const idbGet = (k) => idb('readonly', (s) => s.get(k));
  const idbSet = (k, v) => idb('readwrite', (s) => s.put(v, k));
  const idbDel = (k) => idb('readwrite', (s) => s.delete(k));

  // ---- File System Access (auto-sync to a real file) ----
  const fsSupported = typeof window.showSaveFilePicker === 'function';

  async function writeFile() {
    if (!state.fileHandle) return;
    try {
      const w = await state.fileHandle.createWritable();
      await w.write(JSON.stringify(buildPayload(), null, 2));
      await w.close();
    } catch (e) {
      setSyncStatus('文件写入失败，已退回本地存储', 'warn');
      state.fileHandle = null;
      refreshSyncUI();
    }
  }

  async function readFileIntoState(handle) {
    try {
      const file = await handle.getFile();
      const text = await file.text();
      if (text.trim()) {
        applyPayload(JSON.parse(text));
        saveLocal();
      } else {
        await writeFile(); // empty file → seed it with current data
      }
      return true;
    } catch (e) { return false; }
  }

  async function connectNewFile() {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'pomodoro-history.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      state.fileHandle = handle;
      state.pendingHandle = null;
      await idbSet('fileHandle', handle);
      await writeFile();
      setSyncStatus('已连接 · ' + handle.name + '（数据会自动写入该文件）', 'ok');
      refreshSyncUI();
    } catch (e) { /* user cancelled the picker */ }
  }

  // on startup: restore a previously-connected file (needs a click to re-grant)
  async function restoreFileSync() {
    if (!fsSupported) return;
    const handle = await idbGet('fileHandle');
    if (!handle) return;
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        state.fileHandle = handle;
        await readFileIntoState(handle);
        setSyncStatus('已连接 · ' + handle.name, 'ok');
        syncSteppers(); render(); renderHistory();
      } else {
        state.pendingHandle = handle;
        setSyncStatus('上次连接的文件需重新授权 →', 'warn');
      }
      refreshSyncUI();
    } catch (e) { /* handle no longer valid */ }
  }

  async function onSyncClick() {
    if (!fsSupported) return;
    if (state.pendingHandle) {
      try {
        const perm = await state.pendingHandle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          state.fileHandle = state.pendingHandle;
          state.pendingHandle = null;
          await readFileIntoState(state.fileHandle);
          setSyncStatus('已连接 · ' + state.fileHandle.name, 'ok');
          syncSteppers(); render(); renderHistory(); refreshSyncUI();
          return;
        }
      } catch (e) { /* denied */ }
      return;
    }
    if (state.fileHandle) {
      // already connected → disconnect (keeps the file, stops auto-writing)
      state.fileHandle = null;
      await idbDel('fileHandle');
      setSyncStatus('已断开自动同步（本地存储仍在）', 'warn');
      refreshSyncUI();
      return;
    }
    await connectNewFile();
  }

  function refreshSyncUI() {
    const btn = el.syncBtn;
    if (!fsSupported) {
      btn.disabled = true;
      btn.textContent = '🔗 不支持';
      btn.classList.remove('connected');
      return;
    }
    if (state.fileHandle) {
      btn.textContent = '🔗 已连接';
      btn.classList.add('connected');
    } else if (state.pendingHandle) {
      btn.textContent = '🔗 重新连接';
      btn.classList.remove('connected');
    } else {
      btn.textContent = '🔗 连接文件';
      btn.classList.remove('connected');
    }
  }

  function setSyncStatus(text, kind) {
    el.syncStatus.textContent = text || '';
    el.syncStatus.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  // ---- manual export / import (works in every browser) ----
  function exportHistory() {
    const blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pomodoro-history.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setSyncStatus('已导出 pomodoro-history.json（请放到本 html 同目录）', 'ok');
  }

  function importHistory(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        applyPayload(JSON.parse(reader.result));
        save();
        syncSteppers(); render(); renderHistory();
        setSyncStatus('导入成功', 'ok');
      } catch (e) {
        setSyncStatus('导入失败：文件格式不正确', 'warn');
      }
    };
    reader.readAsText(file);
  }

  function syncSteppers() {
    document.querySelectorAll('.stepper').forEach(st => {
      const key = st.dataset.key;
      st.querySelector('span').textContent = key === 'interval' ? state.interval : state.durations[key];
    });
  }

  function todayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function completedToday() {
    const today = todayKey(Date.now());
    return state.history.filter(h =>
      h.mode === 'focus' && h.status === 'done' && todayKey(h.ts) === today
    ).length;
  }

  const el = {
    body: document.body,
    ring: document.getElementById('ring'),
    time: document.getElementById('time'),
    phaseLabel: document.getElementById('phaseLabel'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
    cycleCount: document.getElementById('cycleCount'),
    settings: document.getElementById('settings'),
    settingsToggle: document.getElementById('settingsToggle'),
    history: document.getElementById('history'),
    historyToggle: document.getElementById('historyToggle'),
    historyList: document.getElementById('historyList'),
    historyStats: document.getElementById('historyStats'),
    clearHistory: document.getElementById('clearHistory'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    importInput: document.getElementById('importInput'),
    syncBtn: document.getElementById('syncBtn'),
    syncStatus: document.getElementById('syncStatus'),
    modeBtns: document.querySelectorAll('.mode-btn'),
  };

  el.ring.style.strokeDasharray = C;
  load();

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function applyTheme() {
    const [c1, c2] = palettes[state.mode];
    el.ring.style.stroke = c1;
    el.startBtn.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
    el.startBtn.style.boxShadow = `0 10px 30px ${hexA(c1, 0.35)}`;
    el.body.className = 'mode-' + state.mode;
    // keep the root background (mobile overscroll area) and browser chrome in sync
    document.documentElement.style.backgroundColor = topColors[state.mode];
    const meta = document.getElementById('themeColor');
    if (meta) meta.setAttribute('content', topColors[state.mode]);
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  function render() {
    el.time.textContent = fmt(state.remaining);
    el.phaseLabel.textContent = labels[state.mode];
    const total = state.durations[state.mode] * 60;
    const frac = total ? state.remaining / total : 0;
    el.ring.style.strokeDashoffset = C * (1 - frac);
    el.startBtn.textContent = state.running ? '暂停' : '开始';
    el.cycleCount.textContent = `今日 ${completedToday()} 个`;
    document.title = `${fmt(state.remaining)} · ${labels[state.mode]}`;
    el.modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  }

  // push a record to history; status 'done' or 'interrupted'
  function logSession(status) {
    const total = state.durations[state.mode] * 60;
    const elapsed = total - state.remaining;
    if (status === 'interrupted' && elapsed < 1) return; // ignore trivial
    state.history.push({
      mode: state.mode,
      status: status,
      seconds: status === 'done' ? total : elapsed,
      ts: Date.now(),
    });
    if (state.history.length > 500) state.history = state.history.slice(-500);
    save();
    renderHistory();
  }

  // log interruption if the current segment had real progress
  function interruptIfProgress() {
    const total = state.durations[state.mode] * 60;
    if (state.remaining < total && state.remaining > 0) logSession('interrupted');
  }

  function setMode(mode, autostart) {
    state.mode = mode;
    state.remaining = state.durations[mode] * 60;
    state.startedAt = null;
    stop();
    applyTheme();
    render();
    if (autostart) start();
  }

  function start() {
    if (state.running || state.remaining <= 0) return;
    state.running = true;
    if (state.startedAt === null) state.startedAt = Date.now();
    state.endAt = Date.now() + state.remaining * 1000;
    state.tick = setInterval(loop, 250);
    render();
  }

  function stop() {
    state.running = false;
    if (state.tick) { clearInterval(state.tick); state.tick = null; }
    render();
  }

  function loop() {
    const left = Math.round((state.endAt - Date.now()) / 1000);
    state.remaining = Math.max(0, left);
    if (state.remaining <= 0) {
      stop();
      complete();
    } else {
      render();
    }
  }

  function complete() {
    chime();
    logSession('done');
    if (state.mode === 'focus') {
      state.cycle++;
      save();
      const next = state.cycle % state.interval === 0 ? 'long' : 'short';
      setMode(next, true);
    } else {
      setMode('focus', true);
    }
  }

  // skip current segment → move to next (no autostart), log partial as interrupted
  function skip() {
    stop();
    interruptIfProgress();
    setMode(state.mode === 'focus' ? 'short' : 'focus', false);
  }

  // simple web-audio chime, no asset needed
  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [880, 1175, 1568];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.3, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        o.start(t); o.stop(t + 0.5);
      });
    } catch (e) { /* audio not available */ }
  }

  // ---- history rendering ----
  const modeMeta = {
    focus: { ico: '🍅', name: '专注' },
    short: { ico: '☕', name: '短休息' },
    long:  { ico: '🌙', name: '长休息' },
  };

  function hhmm(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function dayLabel(ts) {
    const t = todayKey(Date.now());
    const y = todayKey(Date.now() - 86400000);
    const k = todayKey(ts);
    if (k === t) return '今天';
    if (k === y) return '昨天';
    const d = new Date(ts);
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function dur(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? (s > 0 ? `${m} 分 ${s} 秒` : `${m} 分钟`) : `${s} 秒`;
  }

  function renderHistory() {
    const list = el.historyList;
    list.innerHTML = '';

    const focusSec = state.history
      .filter(h => h.mode === 'focus' && h.status === 'done')
      .reduce((a, h) => a + h.seconds, 0);
    const focusDone = state.history.filter(h => h.mode === 'focus' && h.status === 'done').length;
    const broken = state.history.filter(h => h.status === 'interrupted').length;
    el.historyStats.textContent =
      `🍅 ${focusDone} 个 · 专注 ${Math.round(focusSec / 60)} 分钟 · 中断 ${broken} 次`;

    if (!state.history.length) {
      const e = document.createElement('div');
      e.className = 'hist-empty';
      e.textContent = '还没有记录，开始你的第一个番茄吧 🍅';
      list.appendChild(e);
      return;
    }

    let lastDay = null;
    [...state.history].reverse().forEach(h => {
      const day = todayKey(h.ts);
      if (day !== lastDay) {
        lastDay = day;
        const hd = document.createElement('div');
        hd.className = 'hist-day';
        hd.textContent = dayLabel(h.ts);
        list.appendChild(hd);
      }
      const m = modeMeta[h.mode];
      const item = document.createElement('div');
      item.className = 'hist-item' + (h.status === 'interrupted' ? ' interrupted' : '');
      const tag = h.status === 'interrupted'
        ? `中断 · ${dur(h.seconds)}`
        : `完成 · ${dur(h.seconds)}`;
      item.innerHTML =
        `<span class="ico">${h.status === 'interrupted' ? '⛔' : m.ico}</span>` +
        `<span class="label">${m.name}</span>` +
        `<span class="meta">${tag} · ${hhmm(h.ts)}</span>`;
      list.appendChild(item);
    });
  }

  // ---- events ----
  el.startBtn.addEventListener('click', () => state.running ? stop() : start());
  el.resetBtn.addEventListener('click', () => { interruptIfProgress(); setMode(state.mode, false); });
  el.skipBtn.addEventListener('click', skip);

  el.modeBtns.forEach(b =>
    b.addEventListener('click', () => { interruptIfProgress(); setMode(b.dataset.mode, false); })
  );

  el.settingsToggle.addEventListener('click', () => {
    el.history.classList.remove('open');
    el.settings.classList.toggle('open');
  });

  el.historyToggle.addEventListener('click', () => {
    el.settings.classList.remove('open');
    el.history.classList.toggle('open');
    renderHistory();
  });

  el.clearHistory.addEventListener('click', () => {
    if (!state.history.length) return;
    if (confirm('确定清空所有历史记录吗？此操作不可恢复。')) {
      state.history = [];
      state.cycle = 0;
      save();
      renderHistory();
      render();
    }
  });

  el.exportBtn.addEventListener('click', exportHistory);
  el.importBtn.addEventListener('click', () => el.importInput.click());
  el.importInput.addEventListener('change', e => {
    if (e.target.files[0]) importHistory(e.target.files[0]);
    e.target.value = '';
  });
  el.syncBtn.addEventListener('click', onSyncClick);

  document.querySelectorAll('.stepper').forEach(st => {
    const key = st.dataset.key;
    const span = st.querySelector('span');
    span.textContent = key === 'interval' ? state.interval : state.durations[key];
    st.querySelectorAll('button').forEach(btn =>
      btn.addEventListener('click', () => {
        const delta = parseInt(btn.dataset.step, 10);
        if (key === 'interval') {
          state.interval = Math.min(8, Math.max(2, state.interval + delta));
          span.textContent = state.interval;
        } else {
          const v = Math.min(90, Math.max(1, state.durations[key] + delta));
          state.durations[key] = v;
          span.textContent = v;
          if (state.mode === key && !state.running) {
            state.remaining = v * 60;
            render();
          }
        }
      })
    );
  });

  // keyboard: space = start/pause, r = reset
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); state.running ? stop() : start(); }
    if (e.key === 'r' || e.key === 'R') setMode(state.mode, false);
  });

  applyTheme();
  render();
  renderHistory();
  refreshSyncUI();
  restoreFileSync();
})();
</script>
</body>
</html>
